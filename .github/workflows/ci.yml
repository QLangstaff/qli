name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# `actions-rust-lang/setup-rust-toolchain@v1` reads the channel from
# `rust-toolchain.toml` automatically and bundles `Swatinem/rust-cache`
# (cache key derives from `Cargo.lock` + toolchain), so jobs do not
# specify a toolchain version inline. Bump the pin file to bump CI.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup show active-toolchain
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup show active-toolchain
      # The SCIP CLI (scip-code/scip) validates the index `qli index` emits
      # (`crates/qli/tests/index.rs`). Pinned by version *and* checksum; bump
      # all three together. The test finds the binary through `QLI_SCIP_BIN`
      # rather than `PATH` because other tools are also named `scip` (the SCIP
      # optimization solver), and fails — not skips — when `CI` is set and the
      # binary is missing.
      - name: Install scip CLI
        env:
          SCIP_VERSION: v0.10.0
          SCIP_SHA256_LINUX_AMD64: eeb28ebbff443c01609fb1691809958f3f0c7a8651af689a5bc8560061cd8ab0
          SCIP_SHA256_DARWIN_ARM64: 7ea200390e0790b3da8999b7b1cd4e3597700dcb3d354911872523bfe0090779
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   asset=scip-linux-amd64;  sha256="${SCIP_SHA256_LINUX_AMD64}" ;;
            macOS-ARM64) asset=scip-darwin-arm64; sha256="${SCIP_SHA256_DARWIN_ARM64}" ;;
            *) echo "no pinned scip CLI for ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          dir="${RUNNER_TEMP}/scip-cli"
          mkdir -p "${dir}"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${dir}/${asset}.tar.gz" \
            "https://github.com/scip-code/scip/releases/download/${SCIP_VERSION}/${asset}.tar.gz"
          echo "${sha256}  ${dir}/${asset}.tar.gz" | shasum -a 256 --check
          tar -xzf "${dir}/${asset}.tar.gz" -C "${dir}" scip
          "${dir}/scip" --version
          echo "QLI_SCIP_BIN=${dir}/scip" >> "${GITHUB_ENV}"
      - run: cargo test --workspace

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup show active-toolchain
      - run: cargo build --release --workspace

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Every other job builds on the `rust-toolchain.toml` pin, so nothing
      # else notices when a dependency outgrows the `rust-version` the
      # published crates declare (`ignore` and `home` needed rustc 1.88 while
      # the workspace still said 1.85). Read the version from the manifest so
      # the two cannot drift.
      - name: Check on the declared rust-version
        env:
          RUSTFLAGS: ""
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].rust_version')"
          rustup toolchain install "${msrv}" --profile minimal
          cargo "+${msrv}" check --workspace --all-targets --locked

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup show active-toolchain
      # Install with `--locked` so cargo-audit builds from its own lockfile.
      # An unlocked `cargo install` resolves cargo-audit's transitive deps to
      # latest, which can pull in a crate whose MSRV exceeds this repo's
      # pinned toolchain and fail to compile (kstring 2.0.4 needed rustc
      # 1.96.0 while the pin was 1.95.0). `--locked` keeps the audit tool's
      # build independent of the pin.
      - run: cargo install cargo-audit --locked
      - run: cargo audit
