name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# `actions-rust-lang/setup-rust-toolchain@v1` reads the channel from
# `rust-toolchain.toml` automatically and bundles `Swatinem/rust-cache`
# (cache key derives from `Cargo.lock` + toolchain), so jobs do not
# specify a toolchain version inline. Bump the pin file to bump CI.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup show active-toolchain
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup show active-toolchain
      - run: cargo test --workspace

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup show active-toolchain
      - run: cargo build --release --workspace

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup show active-toolchain
      # Install with `--locked` so cargo-audit builds from its own lockfile.
      # An unlocked `cargo install` resolves cargo-audit's transitive deps to
      # latest, which can pull in a crate whose MSRV exceeds this repo's
      # pinned toolchain and fail to compile (kstring 2.0.4 needed rustc
      # 1.96.0 while the pin was 1.95.0). `--locked` keeps the audit tool's
      # build independent of the pin.
      - run: cargo install cargo-audit --locked
      - run: cargo audit
