[package]
name = "qli-outputs"
description = "Output formatters (human, jsonl, scip, lsp) for the qli polyglot CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["qli", "formatter", "lsp", "scip", "jsonl"]
categories = ["development-tools"]

[dependencies]
qli-core = { path = "../qli-core", version = "0.1.2" }
anstyle = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
